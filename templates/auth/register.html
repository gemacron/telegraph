{% extends 'base.html' %}

{% block title %}Crear una Cuenta | DevCord{% endblock %}

{% block content %}
<div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: radial-gradient(circle at center, #2b2d31 0%, #1e1f22 100%);">
    <div style="background: #313338; width: 440px; padding: 36px; border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,0.6); border: 1px solid #3f4147;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 40px; margin-bottom: 6px;">🛡️</div>
            <h2 style="font-size: 22px; font-weight: 700; color: #f2f3f5;">Crear una Cuenta</h2>
            <p style="color: #949ba4; font-size: 13.5px; margin-top: 4px;">Únete a tu equipo de desarrollo seguro</p>
        </div>

        {% if error %}
            <div style="background: rgba(242, 63, 67, 0.2); border: 1px solid #f23f43; color: #ff7b72; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px;">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Nombre de Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus placeholder="tu_alias_dev">
            </div>
            <div class="form-group">
                <label class="form-label">Contraseña (Mínimo 8 caracteres)</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••••••">
            </div>
            <div class="form-group">
                <label class="form-label">Repetir Contraseña</label>
                <input type="password" name="password2" class="form-control" required placeholder="••••••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 8px;">
                Crear Cuenta y Continuar
            </button>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 13.5px; color: #949ba4;">
            ¿Ya tienes una cuenta? 
            <a href="{% url 'login' %}" style="color: var(--text-link); text-decoration: none; font-weight: 600;">Iniciar Sesión</a>
        </div>
    </div>
</div>
{% endblock %}
