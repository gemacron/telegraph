{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}Telegraph - Comunicación Segura para Programadores{% endblock %}</title>
    <!-- Estilos locales sin CDNs ni telemetría externa -->
    <link rel="stylesheet" href="{% static 'css/telegraph.css' %}">
    <link rel="stylesheet" href="{% static 'css/pygments.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
